# Milspår v0.1.0-preview.5 — standalone, no Git or .env needed.
# All installation settings are in this file; no .env required.
# Change port 3080 below if occupied. Keep existing DB credentials when upgrading.
services:
  web:
    image: ghcr.io/greycreations/milspar-web:v0.1.0-preview.5@sha256:183439129e7fc3577a5c95243d0e60b2c99646b23b8c035576c0411e23233a8e
    restart: unless-stopped
    ports:
      - "3080:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
  api:
    image: ghcr.io/greycreations/milspar-api:v0.1.0-preview.5@sha256:4c13cc67d105132ac4923fa43988e890e2e113a9c5fb1698a09d59918653ace8
    restart: unless-stopped
    environment: &api-environment
      API_PORT: 3001
      DATABASE_URL: postgresql://milspar:change-me@db:5432/milspar
      UPLOAD_PATH: /data/uploads
      TZ: Europe/Stockholm
    volumes:
      - uploads:/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 8s
      retries: 5
  migrate:
    image: ghcr.io/greycreations/milspar-api:v0.1.0-preview.5@sha256:4c13cc67d105132ac4923fa43988e890e2e113a9c5fb1698a09d59918653ace8
    restart: "no"
    command: ["pnpm", "--filter", "@milspar/api", "db:migrate"]
    environment: *api-environment
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    environment:
      POSTGRES_DB: milspar
      POSTGRES_USER: milspar
      POSTGRES_PASSWORD: change-me
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U milspar -d milspar"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
  uploads:
