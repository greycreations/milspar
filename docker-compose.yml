services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment: &api-environment
      API_PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-milspar}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-milspar}
      UPLOAD_PATH: /data/uploads
      TZ: ${TZ:-Europe/Stockholm}
    volumes:
      - uploads:/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 8s
      retries: 5
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: "no"
    command: ["pnpm", "--filter", "@milspar/api", "db:migrate"]
    environment: *api-environment
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-milspar}
      POSTGRES_USER: ${POSTGRES_USER:-milspar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-milspar} -d ${POSTGRES_DB:-milspar}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
  uploads:
