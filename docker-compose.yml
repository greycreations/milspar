services:
  web:
    image: milspar-web:dev
    container_name: milspar-web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      - api

  api:
    image: milspar-api:dev
    container_name: milspar-api
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      UPLOAD_PATH: ${UPLOAD_PATH:-/data/uploads}
      TZ: ${TZ:-Europe/Stockholm}
    volumes:
      - uploads:/data/uploads
    depends_on:
      - db

  db:
    image: postgres:17-alpine
    container_name: milspar-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-milspar}
      POSTGRES_USER: ${POSTGRES_USER:-milspar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  uploads:

# Baseline placeholder. Images/build contexts will be replaced when implementation starts.
