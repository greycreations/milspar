services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: milspar-web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:80"
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: milspar-api
    restart: unless-stopped
    environment:
      API_PORT: 3001
      DATABASE_URL: ${DATABASE_URL:-postgresql://milspar:change-me@db:5432/milspar}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      UPLOAD_PATH: /data/uploads
      TZ: ${TZ:-Europe/Stockholm}
    ports:
      - "${API_PORT:-3001}:3001"
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    container_name: milspar-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-milspar}
      POSTGRES_USER: ${POSTGRES_USER:-milspar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-milspar} -d ${POSTGRES_DB:-milspar}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/api/drizzle/0000_vehicle_foundation.sql:/docker-entrypoint-initdb.d/0000_vehicle_foundation.sql:ro

volumes:
  postgres_data:
  uploads:
